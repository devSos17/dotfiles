# Orden de GPUs para Hyprland (AQ_DRM_DEVICES; Aquamarine ignora WLR_DRM_DEVICES).
#
# `order` = rutas de dispositivo en orden de preferencia. El PRIMERO es el GPU
# primario de render. Deben ser symlinks SIN ':' (AQ_DRM_DEVICES usa ':' como
# separador, asi que /dev/dri/by-path/pci-0000:... no sirve). Los symlinks los
# crea una regla udev por maquina, ver oth/gpu-<host>/.
# Si una ruta no existe en la maquina destino, se omite (degrada a autodetect).
gpu:
  ronin:
    order:
      - "/dev/dri/amd-igpu"    # AMD Vega iGPU (04:00.0)  -> render primario, eDP-1 + HDMI-A-1
      - "/dev/dri/nvidia-dgpu" # RTX 3050 Mobile (01:00.0) -> solo DP-1; juegos via prime-run
  abyss:
    # Sin regla udev todavia: autodetect elige la RX 7900 GRE (03:00.0).
    order: []
