# Paquetes por hostname. El run_once instala: common + <hostname>.
# Validado contra repos/AUR el 2026-08-10 durante la reinstalacion de ronin.
#
# Correcciones aplicadas respecto al borrador de junio:
#   swww          -> awww          (el paquete se renombro)
#   paru-git      -> paru          (el -bin/-git compila contra libalpm viejo y
#                                   revienta con "libalpm.so.15 not found")
#   zen-browser   -> brave-bin     (brave es el navegador real, hay brave-flags.conf)
#   asusctl, brillo, vkbasalt, lib32-vkbasalt, ngrok, netbird, clipman
#                 -> movidos de pacman a aur (ya no estan en repos oficiales)
#
# QUITADOS a proposito del borrador de junio (no es que se hayan perdido):
#   snapper, grub-btrfs, timeshift  -> ronin ahora es ext4, no btrfs
#   python-pytorch-opt-cuda, ollama-cuda, darktable -> suite ML/creativa pesada;
#                                      reañadir a mano si se necesita
#   virtualbox-host-dkms, mono, snapd, teamviewer, etcher-bin, sddm-slice-git
#                                   -> one-offs del sistema viejo, sin uso actual
#   rofi-wayland  -> rofi          (rofi ahora Provides/Replaces rofi-wayland)
#   sesh          -> sesh-bin      (nombre real del paquete AUR)
#   fnm,pyenv,rpi-imager -> de AUR a repos oficiales (extra)
#   keyd          -> fuera (descartado; ver nota de bootstrap)
packages:
  common:
    pacman:
      # --- base / sistema ---
      - base-devel
      - git
      - chezmoi
      - openssh
      - networkmanager
      - man-db
      - man-pages
      - reflector
      - pacman-contrib
      - rsync
      - unzip
      - zip
      - wget
      - curl
      - xdg-user-dirs
      - zram-generator
      - bluez
      - bluez-utils
      # --- shell / CLI ---
      - zsh
      - zsh-syntax-highlighting
      - starship
      - tmux
      - atuin
      - fzf
      - ripgrep
      - fd
      - bat
      - eza
      - zoxide
      - yazi
      - btop
      - htop
      - tree
      - jq
      - neovim
      - nushell
      - github-cli
      - lazydocker
      - plocate
      - entr
      # --- Wayland / Hyprland ---
      - hyprland
      - hypridle
      - hyprlock
      - hyprpaper
      - hyprcursor
      - hyprlang
      - hyprutils
      - waybar
      - rofi
      - awww           # antes swww
      - kanshi
      - swaync
      - wl-clipboard
      - grim
      - slurp
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
      - qt5-wayland
      - qt6-wayland
      - qt6ct
      - nwg-look
      - polkit-kde-agent
      - sddm
      - breeze-cursors
      - kitty
      # --- audio ---
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - pipewire-jack
      - wireplumber
      - pavucontrol
      - playerctl
      # --- media / docs ---
      - mpv
      - yt-dlp
      - imagemagick
      - zathura
      - zathura-pdf-mupdf
      - swappy
      - qbittorrent
      # --- escritorio / bandeja ---
      - udiskie
      - solaar
      - nextcloud-client
      - libnotify
      # --- dev ---
      - docker
      - docker-buildx
      - docker-compose
      - go
      - rustup
      - cmake
      - clang
      - nodejs
      - npm
      - python-pip
      - fnm
      - pyenv
      # --- infra / cloud ---
      - ansible-core
      - kubectl
      # --- fuentes ---
      - ttf-jetbrains-mono-nerd
      - noto-fonts
      - noto-fonts-emoji
      - noto-fonts-cjk
      - ttf-liberation
    aur:
      - brave-bin
      - ulauncher
      - wlogout
      - sesh-bin
      - clipman
      - claude-code
      - aws-cli-bin
      - tfenv          # gestor de versiones de terraform
      - waypaper-engine

