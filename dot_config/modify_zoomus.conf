#!/bin/sh
# Zoom reescribe zoomus.conf (email, deviceID, posiciones...): no se versiona completo.
# Solo se fuerzan las claves de Wayland en [General]; el resto queda como Zoom lo deje.
#   xwayland=false          -> Wayland nativo (toolbar de share clickeable, sin desfase XWayland)
#   enableWaylandShare=true -> compartir pantalla via xdg-desktop-portal
exec awk '
  BEGIN { want["xwayland"]="false"; want["enableWaylandShare"]="true" }
  function flush(k) { for (k in want) if (!(k in seen)) print k "=" want[k]; done=1 }
  /^\[/ { if (sec=="General" && !done) flush(); sec=substr($0,2,length($0)-2); hadgen = hadgen || sec=="General" }
  sec=="General" { split($0,kv,"="); if (kv[1] in want) { print kv[1] "=" want[kv[1]]; seen[kv[1]]=1; next } }
  { print }
  END { if (!hadgen) print "[General]"; if (!done) flush() }
'
