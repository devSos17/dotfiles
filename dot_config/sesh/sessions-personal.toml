# ── Main ──────────────────────────────────────────────────────────────────────
# Home base: shell + opencode
[[session]]
name = "main"
path = "~"
startup_command = ""

# ── Services ──────────────────────────────────────────────────────────────────
# Media + audio: spotify | bluetoothctl / pulsemixer
[[session]]
name = "services"
path = "~"
startup_command = "svc-media"
windows = ["btop", "shell"]

# ── Dotfiles ──────────────────────────────────────────────────────────────────
[[session]]
name = "dotfiles"
path = "~/.local/share/chezmoi"
startup_command = "nvim-session"
windows = ["git"]

# ── Vault ─────────────────────────────────────────────────────────────────────
[[session]]
name = "vault"
path = "~/A-Mann"
startup_command = "nvim-session"

# ── CKA Study ─────────────────────────────────────────────────────────────────
# Certified Kubernetes Administrator prep — launches claude agent in lab dir
[[session]]
name = "cka"
path = "~/dev/02_learn/k8/cka-lab"
startup_command = "claude --agent teach 'Review SESSION.log and CLAUDE.md to status where I left off on CKA prep, then continue the session.'"

# ── Shared Windows ────────────────────────────────────────────────────────────

[[window]]
name = "btop"
startup_script = "btop"

[[window]]
name = "git"
startup_script = "git status"

[[window]]
name = "shell"
startup_script = ""
