<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Workaround: OrcaSlicer bundles a static FreeType that segfaults on
     variable fonts (cairo/pango resolve FT_* to the exe's copy).
     Reject the variable-font families and fall back to Noto Sans. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir>~/.cache/fontconfig-orca</cachedir>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/cantarell/*</glob>
      <glob>/usr/share/fonts/Adwaita/*</glob>
      <glob>/usr/share/fonts/adobe-source-code-pro/*</glob>
      <glob>/usr/share/fonts/harmonyos-sans/*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="same"><family>Cantarell</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Adwaita Sans</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Adwaita Mono</family><prefer><family>Noto Sans Mono</family></prefer></alias>
</fontconfig>
